<!doctype html><html lang="ko"><meta charset="utf-8"><title>실제 제품 컴포넌트 로컬 검수</title><style>body{margin:0;background:#ececf0;font:16px system-ui}header{padding:16px}main{display:flex;align-items:flex-start;gap:24px;padding:24px;width:max-content}iframe{border:0;background:white;height:1000px;box-shadow:0 0 0 1px #ddd}h2{font-size:16px}body[data-single] main{display:block;padding:0;width:fit-content}body[data-single] h2{margin:8px 16px}body[data-single] iframe{display:block}</style><header>로컬 합성 데이터 · 실제 회원·운영 거래가 아닙니다. <select id="view"><option>home</option><option>fandom</option><option>support</option><option>my</option><option>result</option><option>dashboard</option></select> <select id="locale"><option>ko</option><option>en</option><option>ja</option><option>zh-Hans</option><option>zh-Hant</option><option>es</option><option>id</option><option>vi</option><option>th</option><option>pt</option><option>fr</option></select></header><main><section><h2>390px</h2><iframe width="390" title="390px 실제 화면"></iframe></section><section><h2>1440px</h2><iframe width="1440" title="1440px 실제 화면"></iframe></section></main><script>const p=new URLSearchParams(location.search);const width=p.get('width');if(['390','1440'].includes(width)){document.body.dataset.single='true';for(const section of document.querySelectorAll('main>section'))if(section.querySelector('iframe').getAttribute('width')!==width)section.hidden=true;}view.value=p.get('view')||'support';locale.value=p.get('locale')||'ko';function update(){for(const f of document.querySelectorAll('iframe'))f.src=`/?view=${view.value}&locale=${locale.value}&state=${p.get('state')||'normal'}${p.get('auth')==='off'?'&auth=off':''}`;}view.onchange=locale.onchange=update;update();</script></html>
