name: Fan design system

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "DESIGN.md"
      - "AGENTS.md"
      - "docs/design/**"
      - "package*.json"
      - "scripts/ci-workflows.test.mjs"
      - "scripts/ci-test-scope*.mjs"
      - "scripts/design-lint*.mjs"
      - "stylelint.config.mjs"
      - ".github/workflows/fan-design-system.yml"
  push:
    branches: [main, release/production]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: fan-design-system-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui-contracts:
    strategy:
      fail-fast: false
      matrix:
        group: [unit, wave-programs, runmusic, layout-and-recovery]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Compute the node_modules cache key
        id: node_modules_key
        shell: bash
        run: echo "prefix=node-modules-v1-$RUNNER_OS-$RUNNER_ARCH-$(. /etc/os-release && echo "$ID$VERSION_ID")-node$(node -p process.versions.node)-npm$(npm -v)" >> "$GITHUB_OUTPUT"
      - name: Restore locked node_modules
        id: node_modules
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules
            apps/*/node_modules
          key: ${{ steps.node_modules_key.outputs.prefix }}-${{ hashFiles('package-lock.json', 'package.json', 'apps/*/package.json', 'scripts/apply-security-patches.mjs') }}
      - name: Reinstall when restored node_modules is unusable
        if: steps.node_modules.outputs.cache-hit == 'true'
        shell: bash
        run: |
          if ! node scripts/verify-installed-node-modules.mjs; then
            echo '::warning::Restored node_modules is unusable; reinstalling from the lockfile'
            rm -rf node_modules apps/*/node_modules
            npm ci --ignore-scripts
          fi
      - name: Install locked dependencies
        if: steps.node_modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
      - name: Save locked node_modules
        if: steps.node_modules.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules
            apps/*/node_modules
          key: ${{ steps.node_modules_key.outputs.prefix }}-${{ hashFiles('package-lock.json', 'package.json', 'apps/*/package.json', 'scripts/apply-security-patches.mjs') }}
      - run: npm run security:patch
      - name: Verify parallel CI contracts
        if: matrix.group == 'unit'
        run: node --test scripts/ci-test-scope.test.mjs scripts/ci-workflows.test.mjs scripts/design-lint.test.mjs
      - name: Design token and shared component lint (new violations only)
        if: matrix.group == 'unit'
        env:
          DESIGN_LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/design-lint.mjs --report "$RUNNER_TEMP/design-lint-report.json"
      - name: Verify shared roles and migrated screens
        if: matrix.group == 'unit'
        run: >-
          npm run test --workspace @byus/web -- --maxWorkers=3
          components/fan-ui
          components/login-page.test.tsx components/byus-session-provider.test.tsx
          features/connect/runmusic-screen.test.tsx features/connect/kyaa-wave-participation-screen.test.tsx
          features/reliability/client/request-deadline.test.ts
          components/fan-calendar
          components/onchain
          components/fan-shell/fan-site-footer.test.tsx
          components/celebrity-fan-page.test.tsx
          components/live-status-indicator.test.tsx
          components/guest-home.test.tsx
          components/deferred-root-clients.test.tsx
          components/ui/overlay/accessible-overlay.test.tsx features/groups/ui/group-language-dialog.test.tsx
          app/events/page.test.tsx features/home/ui/events-catalog-screen.test.tsx features/home/ui/events-pagination.test.tsx
          features/my/ui/my-screen.test.tsx
          features/passport/ui/passport-screens.test.tsx features/passport/domain/passport-read-model.test.ts
          features/benefit/ui/creator-raffles-screen.test.tsx
          features/live/ui
          features/fanpage/ui/gggi-event-entry.test.tsx features/fanpage/ui/gggi-participation-entry.test.tsx
          features/fanpage/ui/cheer-event.test.tsx
          features/fanpage/ui/cheer-event-photocard.test.tsx
          features/wave-stage features/public-live-dashboard app/pages/live-dashboard
          features/fanpage/ui/wave-programs.test.tsx
          features/fanpage/ui/wave-missions.test.tsx
          features/fanpage/ui/wave-mission-progress.test.tsx
          features/fanpage/ui/wave-media-refresh.test.tsx
          features/fanpage/ui/notice-comments.test.tsx
          features/fan-posts/ui/wave-program-posts.test.tsx
          features/fan-posts/ui/prepare-post-photo.test.ts
          features/fan-posts/ui/fan-post-ui.test.tsx
          features/content-safety/ui/content-actions.test.tsx
          features/benefit/ui/benefit-screen.test.tsx
          features/benefit/ui/raffle-result-panel.test.tsx
          components/admin/raffle-operations-panel.test.tsx
      # Runs the Privy-mocking tests on the island backend that production builds use. The config arrives with the
      # island change; until it is on the branch under test the step is a no-op, afterwards it always runs.
      - name: Verify the Privy island backend tests
        if: matrix.group == 'unit'
        run: |
          if [ -f apps/web/vitest.island.config.ts ]; then
            npm run test --workspace @byus/web -- --config vitest.island.config.ts --maxWorkers=3
          else
            echo "apps/web/vitest.island.config.ts is not on this branch; skipping the island project"
          fi
      - name: Install browser for card layout regression
        if: matrix.group != 'unit'
        run: npx playwright install chromium && (timeout 180 npx playwright install-deps chromium || echo "::warning::apt mirrors unavailable; using the runner image browser libraries")
      - name: Verify fan list dates at 390px across all locales
        if: matrix.group == 'layout-and-recovery'
        run: npm run test --workspace @byus/web -- --config e2e/fan-list-local/vitest.config.ts
      - name: Verify real card rows across languages and viewports
        if: matrix.group == 'layout-and-recovery'
        run: node apps/web/e2e/community-stamps-local/passport-run.mjs
      - name: Verify event list shell alignment and spacing
        if: matrix.group == 'layout-and-recovery'
        run: node apps/web/e2e/banner-local/events-layout-run.mjs
      - name: Verify Wave programs across languages and participation states
        if: matrix.group == 'wave-programs'
        run: |
          node apps/web/e2e/wave-programs-local/run.mjs
          node apps/web/e2e/wave-programs-local/actions.mjs
          node apps/web/e2e/wave-programs-local/polling.mjs
      - name: Verify fan event stage, simultaneous winners and recovery
        if: matrix.group == 'layout-and-recovery'
        run: node apps/web/e2e/wave-stage-local/run.mjs
      - name: Verify GGGI explicit entry and retry recovery
        if: matrix.group == 'layout-and-recovery'
        run: node apps/web/e2e/gggi-local/run-event.mjs
      - name: Verify RUNMUSIC entry, results and banner across languages
        if: matrix.group == 'runmusic'
        run: node apps/web/e2e/runmusic-local/run.mjs
      - name: Verify Wave participation and login recovery across languages
        if: matrix.group == 'layout-and-recovery'
        run: node apps/web/e2e/kyaa-wave-participation-local/run.mjs
      - name: Verify legacy cheer actions and reply recovery
        if: matrix.group == 'layout-and-recovery'
        run: node apps/web/e2e/community-compact-local/legacy-cheer-run.mjs
      - name: Preserve card layout evidence
        if: always() && matrix.group == 'layout-and-recovery'
        uses: actions/upload-artifact@v4
        with:
          name: card-layout-evidence
          path: |
            test-results/passport-layout
            test-results/legacy-cheer
          if-no-files-found: ignore
      - name: Preserve RUNMUSIC browser evidence
        if: always() && matrix.group == 'runmusic'
        uses: actions/upload-artifact@v4
        with:
          name: runmusic-browser-evidence
          path: test-results/runmusic-local
          if-no-files-found: ignore
      - name: Preserve Wave participation browser evidence
        if: always() && matrix.group == 'layout-and-recovery'
        uses: actions/upload-artifact@v4
        with:
          name: wave-participation-browser-evidence
          path: test-results/kyaa-wave-participation
          if-no-files-found: ignore

  shared-ui-contracts:
    if: always()
    needs: [ui-contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Require every UI contract group to succeed
        env:
          CONTRACTS_RESULT: ${{ needs.ui-contracts.result }}
        run: test "$CONTRACTS_RESULT" = success
