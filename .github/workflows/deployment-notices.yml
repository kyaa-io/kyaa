name: Deployment notices

on:
  workflow_run:
    workflows: [AWS platform release]
    types: [completed]
  push:
    branches: [main, release/production]
  pull_request:
  deployment_status:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [recover, resolve-receipt, plan-partial, resume-partial]
        default: recover
      source_receipt_id:
        type: string
      plan_hash:
        type: string
      outcome:
        type: choice
        options: [sent, rejected]
      message_ids:
        description: "Inspected Telegram message IDs, comma separated (for rejected: adjacent evidence message)"
        type: string
      deployment_id:
        description: 'Verified AWS deployment currently live on kyaa.io (or dev.kyaa.io for environment dev)'
        required: true
        type: string
      environment:
        description: 'GitHub Environment of the deployment: prod (production and wave) or dev'
        type: choice
        options: [prod, dev]
        default: prod
      unsent_receipt_id:
        description: 'Optional uncertain receipt confirmed absent from the Telegram room'
        type: string
      inspection_evidence:
        description: 'Room, inspection time, last delivered message and evidence of non-delivery'
        type: string

permissions:
  contents: read

jobs:
  validate-notice:
    concurrency:
      group: ${{ github.workflow }}-validate-notice-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    # Pinned: this job runs the release tests, so it must use the same runner image as the release job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Compute the node_modules cache key
        id: node_modules_key
        shell: bash
        run: echo "prefix=node-modules-v1-$RUNNER_OS-$RUNNER_ARCH-$(. /etc/os-release && echo "$ID$VERSION_ID")-node$(node -p process.versions.node)-npm$(npm -v)" >> "$GITHUB_OUTPUT"
      - name: Restore locked node_modules
        id: node_modules
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules
            apps/*/node_modules
          key: ${{ steps.node_modules_key.outputs.prefix }}-${{ hashFiles('package-lock.json', 'package.json', 'apps/*/package.json', 'scripts/apply-security-patches.mjs') }}
      - name: Reinstall when restored node_modules is unusable
        if: steps.node_modules.outputs.cache-hit == 'true'
        shell: bash
        run: |
          if ! node scripts/verify-installed-node-modules.mjs; then
            echo '::warning::Restored node_modules is unusable; reinstalling from the lockfile'
            rm -rf node_modules apps/*/node_modules
            npm ci --ignore-scripts
          fi
      - run: npm ci --ignore-scripts
        if: steps.node_modules.outputs.cache-hit != 'true'
      - name: Save locked node_modules
        if: steps.node_modules.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules
            apps/*/node_modules
          key: ${{ steps.node_modules_key.outputs.prefix }}-${{ hashFiles('package-lock.json', 'package.json', 'apps/*/package.json', 'scripts/apply-security-patches.mjs') }}
      - run: npm run security:patch
      - name: Test notice delivery safeguards
        run: node --test scripts/deployment-notices.test.mjs scripts/recover-deployment-notice.test.mjs scripts/resolve-deployment-receipt.test.mjs scripts/resume-partial-notice.test.mjs scripts/aws-release*.test.mjs scripts/aws-wave-release.test.mjs
      - name: Check Korean release notes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/deployment-notices.mjs check "$BASE_SHA" "$HEAD_SHA"

  notify:
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.repository.id == 1307387500 &&
      github.repository == 'kyaa-io/kyaa' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.creator.login == 'vercel[bot]' &&
      contains(fromJSON('["Production","Production – kyaa","Production – kyaawave"]'), github.event.deployment.environment) &&
      github.event.deployment.creator.login == 'vercel[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: telegram-production-notices
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Execute trusted current main; deployed files are read as data with git show.
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Announce successful production deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BUG_REPORT_OPERATOR_SECRET: ${{ secrets.TELEGRAM_BUG_REPORT_OPERATOR_SECRET }}
        run: node scripts/deployment-notices.mjs send

# Production AWS notices remain inside aws-platform.yml.

  recover:
    name: Resume verified deployment notice
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.operation == 'recover' || inputs.operation == '')
    environment: ${{ inputs.environment == 'dev' && 'dev' || 'prod' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ inputs.environment == 'dev' && 'aws-release-dev' || 'telegram-production-notices' }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      deployments: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Reconcile inspected receipt and resume through the canonical sender
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BUG_REPORT_OPERATOR_SECRET: ${{ secrets.TELEGRAM_BUG_REPORT_OPERATOR_SECRET }}
          NOTICE_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          NOTICE_ENVIRONMENT: ${{ inputs.environment }}
          NOTICE_UNSENT_RECEIPT_ID: ${{ inputs.unsent_receipt_id }}
          NOTICE_INSPECTION_EVIDENCE: ${{ inputs.inspection_evidence }}
        run: node scripts/recover-deployment-notice.mjs

  dev-notice:
    name: DEV deployment notice
    # The DEV notice endpoint only trusts main; do not widen server policy for a hotfix.
    if: >-
      github.event_name == 'workflow_run' &&
      github.repository == 'kyaa-io/kyaa' &&
      github.event.repository.id == 1307387500 &&
      github.event.workflow_run.repository.id == 1307387500 &&
      github.event.workflow_run.head_repository.id == 1307387500 &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.path == '.github/workflows/aws-platform.yml' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    continue-on-error: true
    # Pinned to match the release job's runner image instead of the moving ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: dev
    concurrency:
      group: aws-release-dev
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      deployments: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: aws-result-dev
          path: work/aws-release
      - name: Bind deployment artifact to the completed source run
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import assert from "node:assert/strict"; const e=JSON.parse(readFileSync("work/aws-release/aws-deployment-event.json")); assert.equal(e.deployment.payload.workflowRunId, Number(process.env.SOURCE_RUN_ID)); assert.equal(e.deployment.sha, process.env.SOURCE_SHA);'
      - name: Notify the exact successful DEV release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_NOTICE_EVENT_PATH: ${{ github.workspace }}/work/aws-release/aws-deployment-event.json
          TELEGRAM_BUG_REPORT_OPERATOR_SECRET: ${{ secrets.TELEGRAM_BUG_REPORT_OPERATOR_SECRET }}
        run: node scripts/dev-deployment-notices.mjs
      - name: Preserve an uncertain DEV notice for inspection
        if: failure()
        run: |
          echo '::error::DEV deployment succeeded; its notice failed. Inspect the DEV receipt and room before retrying.'

  resolve-receipt:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'resolve-receipt' && inputs.environment == 'prod'
    environment: prod
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: telegram-production-notices
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Resolve inspected receipt without sending
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NOTICE_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          NOTICE_OUTCOME: ${{ inputs.outcome }}
          NOTICE_MESSAGE_IDS: ${{ inputs.message_ids }}
          NOTICE_INSPECTION_EVIDENCE: ${{ inputs.inspection_evidence }}
        run: node scripts/resolve-deployment-receipt.mjs

  partial-recovery:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.operation == 'plan-partial' || inputs.operation == 'resume-partial') && inputs.environment == 'prod'
    environment: prod
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: telegram-production-notices
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Plan or resume verified partial delivery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NOTICE_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          NOTICE_OPERATION: ${{ inputs.operation }}
          NOTICE_SOURCE_RECEIPT_ID: ${{ inputs.source_receipt_id }}
          NOTICE_PLAN_HASH: ${{ inputs.plan_hash }}
          TELEGRAM_BUG_REPORT_OPERATOR_SECRET: ${{ secrets.TELEGRAM_BUG_REPORT_OPERATOR_SECRET }}
          NOTICE_MESSAGE_IDS: ${{ inputs.message_ids }}
          NOTICE_INSPECTION_EVIDENCE: ${{ inputs.inspection_evidence }}
        run: node scripts/resume-partial-notice.mjs
