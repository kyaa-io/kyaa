name: Admin UI and analytics
on:
  pull_request:
    paths:
      - 'apps/web/components/admin/**'
      - 'apps/web/features/analytics/**'
      - 'apps/web/server/admin/**'
      - 'apps/web/server/g6/**'
      - 'apps/web/app/admin/**'
      - 'apps/web/app/api/admin/**'
      - 'supabase/migrations/*admin_overview*'
      - '.github/workflows/admin-ui.yml'
      - 'package*.json'
  push:
    branches: [main]
    paths:
      - 'apps/web/components/admin/**'
      - 'apps/web/features/analytics/**'
      - 'apps/web/server/admin/**'
      - 'apps/web/server/g6/**'
      - 'apps/web/app/admin/**'
      - 'apps/web/app/api/admin/**'
      - 'supabase/migrations/*admin_overview*'
      - '.github/workflows/admin-ui.yml'
      - 'package*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-contracts:
    concurrency:
      group: ${{ github.workflow }}-admin-contracts-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Compute the node_modules cache key
        id: node_modules_key
        shell: bash
        run: echo "prefix=node-modules-v1-$RUNNER_OS-$RUNNER_ARCH-$(. /etc/os-release && echo "$ID$VERSION_ID")-node$(node -p process.versions.node)-npm$(npm -v)" >> "$GITHUB_OUTPUT"
      - name: Restore locked node_modules
        id: node_modules
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules
            apps/*/node_modules
          key: ${{ steps.node_modules_key.outputs.prefix }}-${{ hashFiles('package-lock.json', 'package.json', 'apps/*/package.json', 'scripts/apply-security-patches.mjs') }}
      - name: Reinstall when restored node_modules is unusable
        if: steps.node_modules.outputs.cache-hit == 'true'
        shell: bash
        run: |
          if ! node scripts/verify-installed-node-modules.mjs; then
            echo '::warning::Restored node_modules is unusable; reinstalling from the lockfile'
            rm -rf node_modules apps/*/node_modules
            npm ci --ignore-scripts
          fi
      - run: npm ci --ignore-scripts
        if: steps.node_modules.outputs.cache-hit != 'true'
      - name: Save locked node_modules
        if: steps.node_modules.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules
            apps/*/node_modules
          key: ${{ steps.node_modules_key.outputs.prefix }}-${{ hashFiles('package-lock.json', 'package.json', 'apps/*/package.json', 'scripts/apply-security-patches.mjs') }}
      - run: npm run security:patch
      - run: npm run typecheck
      - name: Verify admin UI, authorization and analytics contracts
        run: >-
          npm run test --workspace @byus/web -- --maxWorkers=3
          components/admin features/analytics server/admin server/g6
