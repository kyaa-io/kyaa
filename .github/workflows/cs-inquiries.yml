name: CS inquiry flow
on:
  pull_request:
    paths:
      - 'apps/web/features/support/**'
      - 'apps/web/server/support/**'
      - 'apps/web/server/auth/**'
      - 'apps/web/server/admin/**'
      - 'apps/web/server/fan-auth/**'
      - 'apps/web/app/**/inquiries/**'
      - 'apps/web/e2e/cs-local/**'
      - 'apps/web/components/fan-shell/**'
      - 'apps/web/components/fan-ui/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/cs_inquiries.sql'
      - 'scripts/verify-cs-*.sh'
      - 'package*.json'
      - '.github/workflows/cs-inquiries.yml'
  push:
    branches: [main, release/production]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  cs-inquiries:
    concurrency:
      group: ${{ github.workflow }}-cs-inquiries-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run security:patch
      - run: npm run test --workspace @byus/web -- features/support server/support --maxWorkers=3
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Local SQL, authority, concurrency and browser flow
        run: bash scripts/verify-cs-local.sh
      - name: Restore the ffmpeg-static binary
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'kyaa-io/kyaa') }}
        id: ffmpeg-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules/ffmpeg-static/ffmpeg
            node_modules/ffmpeg-static/ffmpeg.LICENSE
            node_modules/ffmpeg-static/ffmpeg.README
          key: ffmpeg-static-v1-${{ runner.os }}-${{ runner.arch }}-5.3.0-${{ hashFiles('package-lock.json') }}
      - name: Install the approved media runtime for the ordinary build
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'kyaa-io/kyaa') && steps.ffmpeg-cache.outputs.cache-hit != 'true' }}
        run: |
          d=10
          for n in 1 2 3 4; do
            npm rebuild ffmpeg-static --foreground-scripts && exit 0
            [ "$n" = 4 ] && exit 1
            echo "ffmpeg-static download failed (attempt $n of 4); retrying in ${d}s" >&2
            sleep "$d"; d=$((d*2))
          done
      # Next's build typecheck took 6.2 of this job's 8.6 minutes from scratch. Its build info lets it re-check only what changed;
      # a missing or unusable file means a full check, and backend-security still runs the full `npm run typecheck` on every push.
      - name: Restore the typecheck build info of an earlier ordinary build
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'kyaa-io/kyaa') }}
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/web/.next/cache/.tsbuildinfo
          key: cs-typecheck-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/tsconfig.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cs-typecheck-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/tsconfig.json') }}-
      - name: Build ordinary application
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'kyaa-io/kyaa') }}
        run: npm run build
        env:
          NEXT_PUBLIC_PRIVY_APP_ID: cs-build-check
      - name: Save the typecheck build info of this ordinary build
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'kyaa-io/kyaa') }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/web/.next/cache/.tsbuildinfo
          key: cs-typecheck-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/tsconfig.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Ordinary build rejects local test identities
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'kyaa-io/kyaa') }}
        run: node apps/web/e2e/cs-local/production-auth.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cs-inquiry-evidence
          path: apps/web/test-results/cs-local
