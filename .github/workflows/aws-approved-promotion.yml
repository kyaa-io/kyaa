name: Approved AWS production promotion
run-name: Approved production promotion of dev ${{ inputs.source_run_id }} (${{ inputs.expected_sha }})
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Main push dev run explicitly approved for production
        type: string
        required: true
      expected_sha:
        description: Exact 40-character source SHA approved for production
        type: string
        required: true
permissions:
  contents: read
jobs:
  wait-and-promote:
    if: github.ref == 'refs/heads/main' && github.repository == 'kyaa-io/kyaa'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    concurrency:
      group: aws-approved-promotion-${{ inputs.source_run_id }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test approved promotion safeguards
        run: node --test scripts/aws-approved-promotion.test.mjs
      - name: Wait on GitHub for the approved dev run and request production
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/aws-approved-promotion.mjs
