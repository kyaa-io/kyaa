name: Search health

on:
  deployment_status:
  schedule:
    - cron: '43 22 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['scripts/search-health*', '.github/workflows/search-health.yml']
  push:
    branches: [main]
    paths: ['scripts/search-health*', '.github/workflows/search-health.yml']

permissions:
  contents: read

jobs:
  contract:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node --test scripts/search-health.test.mjs

  production:
    if: >-
      github.repository == 'kyaa-io/kyaa' && github.event.repository.id == 1307387500 &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.creator.login == 'vercel[bot]' &&
       github.event.deployment.environment == 'Production' &&
       github.event.deployment.creator.login == 'vercel[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: kyaa-search-health-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node --test scripts/search-health.test.mjs
      - name: Check production search and share responses
        env:
          SEARCH_HEALTH_OUTPUT: work/search-health.json
        run: node scripts/search-health.mjs
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: search-health-${{ github.run_id }}
          path: work/search-health.json
          retention-days: 30
