name: AWS platform release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, prod]
        default: dev
        required: true
      source_run_id:
        description: Successful dev build workflow run ID (required for promotion)
        type: string
      require_forward_only:
        description: Reject stale or unknown live versions for a reserved promotion
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.repository == 'kyaa-io/kyaa'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment || 'dev' }}
    concurrency:
      group: ${{ inputs.environment == 'prod' && 'telegram-production-notices' || format('aws-release-{0}', inputs.environment || 'dev') }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
      deployments: write
      checks: write
    env:
      RELEASE_ENV: ${{ inputs.environment || 'dev' }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      REQUIRE_FORWARD_ONLY: ${{ inputs.require_forward_only }}
      AWS_PLATFORM_CONFIG_JSON: ${{ vars.AWS_PLATFORM_CONFIG_JSON }}
      LEGACY_PG_CRON_PROOF_JSON: ${{ vars.LEGACY_PG_CRON_PROOF_JSON }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      AWS_SCHEDULE_CONFIG_JSON: ${{ vars.AWS_SCHEDULE_CONFIG_JSON }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Lint only actual CloudFormation templates
        run: |
          python -m pip install cfn-lint==1.58.0
          cfn-lint --region ap-northeast-2 --template infrastructure/aws/platform/network.json infrastructure/aws/platform/environment.json infrastructure/aws/platform/ci-role.json infrastructure/aws/platform/scheduled-workers.json infrastructure/aws/worker/notification-monitor.json
          cfn-lint --region us-east-1 --template infrastructure/aws/platform/edge-security.json
      - name: Test release and notice safeguards
        run: node --test scripts/aws-release*.test.mjs scripts/deployment-notices.test.mjs
      - name: Validate promotion run sources
        if: env.RELEASE_ENV != 'dev'
        run: |
          node scripts/aws-release.mjs source "$RELEASE_ENV" "$SOURCE_RUN_ID"
      - uses: actions/download-artifact@v4
        if: env.RELEASE_ENV != 'dev'
        with:
          name: aws-release-source
          path: work/aws-release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
      - uses: actions/download-artifact@v4
        if: env.RELEASE_ENV == 'prod'
        with:
          name: aws-result-dev
          path: work/aws-release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: byus-${{ github.run_id }}
          allowed-account-ids: ${{ fromJSON(vars.AWS_PLATFORM_CONFIG_JSON).accountId }}
      - name: Validate environment config and actual OIDC caller before any push
        run: node scripts/aws-release.mjs preflight "$RELEASE_ENV"
      - name: Build one secretless dev image
        if: env.RELEASE_ENV == 'dev'
        shell: bash
        run: |
          set -euo pipefail
          repository=$(jq -r '.parameters.WebImageUri | split("@")[0]' <<<"$AWS_PLATFORM_CONFIG_JSON")
          registry=${repository%%/*}
          aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin "$registry"
          tag="$repository:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --platform linux/amd64 -f Dockerfile.aws -t "$tag" .
          docker run --rm --entrypoint node "$tag" -e "if(require('fs').existsSync('/app/.env'))process.exit(1);if(process.version.split('.')[0]!=='v24')process.exit(1)"
          docker push "$tag"
          name=${repository#*/}
          digest=$(aws ecr describe-images --region ap-northeast-2 --repository-name "$name" --image-ids imageTag="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --query 'imageDetails[0].imageDigest' --output text)
          media_tag="$repository:media-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --platform linux/amd64 -f Dockerfile.media.aws -t "$media_tag" .
          docker run --rm --entrypoint node "$media_tag" -e "require('sharp');const c=require('node:child_process');c.execFileSync(require('ffmpeg-static'),['-version']);c.execFileSync(require('ffprobe-static').path,['-version']);require('./index.cjs')"
          docker push "$media_tag"
          media_digest=$(aws ecr describe-images --region ap-northeast-2 --repository-name "$name" --image-ids imageTag="media-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --query 'imageDetails[0].imageDigest' --output text)
          node scripts/aws-release-bundle.mjs
          cron_digest=$(sha256sum work/aws-release/aws-cron.zip | cut -d ' ' -f1)
          node scripts/aws-release.mjs build-record dev "$digest" "$repository@$digest" "$media_digest" "$repository@$media_digest" "$cron_digest"
      - name: Bind artifact, main ancestry and environment config
        id: prepare
        run: node scripts/aws-release.mjs prepare "$RELEASE_ENV"
      - name: Promote the same image into the target account
        if: env.RELEASE_ENV != 'dev'
        env:
          SOURCE_IMAGE: ${{ steps.prepare.outputs.source_image }}
          TARGET_IMAGE: ${{ steps.prepare.outputs.target_image }}
          RELEASE_DIGEST: ${{ steps.prepare.outputs.digest }}
          RELEASE_SHA: ${{ steps.prepare.outputs.sha }}
          SOURCE_MEDIA_IMAGE: ${{ steps.prepare.outputs.source_media_image }}
          TARGET_MEDIA_IMAGE: ${{ steps.prepare.outputs.target_media_image }}
          MEDIA_DIGEST: ${{ steps.prepare.outputs.media_digest }}
        shell: bash
        run: |
          set -euo pipefail
          for kind in web media; do
            if [ "$kind" = media ]; then SOURCE_IMAGE="$SOURCE_MEDIA_IMAGE"; TARGET_IMAGE="$TARGET_MEDIA_IMAGE"; RELEASE_DIGEST="$MEDIA_DIGEST"; fi
            if [ "$SOURCE_IMAGE" != "$TARGET_IMAGE" ]; then
            source_registry=${SOURCE_IMAGE%%/*}
            target_registry=${TARGET_IMAGE%%/*}
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin "$source_registry"
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin "$target_registry"
            docker pull "$SOURCE_IMAGE"
            target_repo=${TARGET_IMAGE%@*}
            tag="release-$RELEASE_SHA-${RELEASE_DIGEST#sha256:}"
            docker tag "$SOURCE_IMAGE" "$target_repo:$tag"
            docker push "$target_repo:$tag"
            target_name=${target_repo#*/}
            actual=$(aws ecr describe-images --region ap-northeast-2 --repository-name "$target_name" --image-ids imageTag="$tag" --query 'imageDetails[0].imageDigest' --output text)
            test "$actual" = "$RELEASE_DIGEST"
            fi
          done
      - name: Validate and deploy CloudFormation
        run: node scripts/aws-platform-deploy.mjs deploy --config work/aws-release/aws-release-config.json --execute
      - name: Require healthy ECS and exact release readiness
        id: verify
        run: node scripts/aws-release.mjs verify "$RELEASE_ENV"
      - name: Deploy ownership-verified disabled-by-default schedules
        if: env.AWS_SCHEDULE_CONFIG_JSON != ''
        run: node scripts/aws-release-cron.mjs deploy
      - name: Record the verified GitHub deployment
        run: node scripts/aws-release.mjs record "$RELEASE_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: aws-release-source
          path: |
            work/aws-release/aws-release.json
            work/aws-release/aws-cron.zip
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: aws-result-${{ env.RELEASE_ENV }}
          path: |
            work/aws-release/aws-${{ env.RELEASE_ENV }}-result.json
            work/aws-release/aws-deployment-event.json
          overwrite: true
      # GITHUB_TOKEN deployment statuses do not trigger another workflow.
      - name: Notify only a release live on the public production domain
        if: env.RELEASE_ENV == 'prod' && steps.verify.outputs.public_live == 'true'
        env:
          DEPLOYMENT_NOTICE_EVENT_PATH: ${{ github.workspace }}/work/aws-release/aws-deployment-event.json
          TELEGRAM_BUG_REPORT_OPERATOR_SECRET: ${{ secrets.TELEGRAM_BUG_REPORT_OPERATOR_SECRET }}
        run: node scripts/deployment-notices.mjs send
