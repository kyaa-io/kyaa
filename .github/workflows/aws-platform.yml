name: AWS platform release
on:
  push:
    branches: [main, release/production]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, prod]
        default: dev
        required: true
      source_run_id:
        description: Successful dev build workflow run ID (required for promotion)
        type: string
      require_forward_only:
        description: Reject stale or unknown live versions for a reserved promotion
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ inputs.environment == 'prod' && 'telegram-production-notices' || format('aws-release-{0}', inputs.environment || 'dev') }}
  queue: max
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'kyaa-io/kyaa' && (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/release/production' && github.event_name == 'push'))
    # Pinned: ubuntu-latest moved to 26.04. A fresh media image built there is suspected of failing the dev scheduled-workers stack update
    # (fresh media builds only happen off main, where reuse is off); the last good media build came from ubuntu-24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment || 'dev' }}
    outputs:
      public_live: ${{ steps.verify.outputs.public_live }}
    permissions:
      contents: read
      actions: read
      id-token: write
      deployments: write
      checks: write
    env:
      RELEASE_ENV: ${{ inputs.environment || 'dev' }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      REQUIRE_FORWARD_ONLY: ${{ inputs.require_forward_only }}
      AWS_PLATFORM_CONFIG_JSON: ${{ vars.AWS_PLATFORM_CONFIG_JSON }}
      LEGACY_PG_CRON_PROOF_JSON: ${{ vars.LEGACY_PG_CRON_PROOF_JSON }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      AWS_SCHEDULE_CONFIG_JSON: ${{ vars.AWS_SCHEDULE_CONFIG_JSON }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run security:patch
      - name: Lint only actual CloudFormation templates
        run: |
          python -m pip install cfn-lint==1.58.0
          cfn-lint --region ap-northeast-2 --template infrastructure/aws/platform/network.json infrastructure/aws/platform/environment.json infrastructure/aws/platform/ci-role.json infrastructure/aws/platform/scheduled-workers.json infrastructure/aws/worker/notification-monitor.json infrastructure/aws/wave/site.json infrastructure/aws/wave/ci-role.json
          cfn-lint --region us-east-1 --template infrastructure/aws/platform/edge-security.json
      - name: Test release and notice safeguards
        run: node --test scripts/aws-release*.test.mjs scripts/deployment-notices.test.mjs scripts/dev-deployment-notices.test.mjs scripts/aws-wave-release.test.mjs
      - name: Validate promotion run sources
        if: env.RELEASE_ENV != 'dev'
        run: |
          node scripts/aws-release.mjs source "$RELEASE_ENV" "$SOURCE_RUN_ID"
      - uses: actions/download-artifact@v4
        if: env.RELEASE_ENV != 'dev'
        with:
          name: aws-release-source
          path: work/aws-release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
      - uses: actions/download-artifact@v4
        if: env.RELEASE_ENV == 'prod'
        with:
          name: aws-result-dev
          path: work/aws-release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: byus-${{ github.run_id }}
          allowed-account-ids: ${{ fromJSON(vars.AWS_PLATFORM_CONFIG_JSON).accountId }}
      - name: Validate environment config and actual OIDC caller before any push
        run: node scripts/aws-release.mjs preflight "$RELEASE_ENV"
      - name: Stop early when this commit is not on main
        if: env.RELEASE_ENV == 'dev'
        run: node scripts/aws-release.mjs ancestry "$RELEASE_ENV"
      - name: Stop early when a required check of this commit already failed
        if: env.RELEASE_ENV == 'dev'
        run: node scripts/aws-release-ci.mjs "$GITHUB_SHA" "$GITHUB_RUN_ID" --fail-fast-only
      - name: Resolve media inputs and trusted reusable image
        id: media
        if: env.RELEASE_ENV == 'dev'
        run: node scripts/aws-release-media-reuse.mjs prepare "$GITHUB_SHA"
      - name: Scope DEV Next cache to the verified build base
        id: next_cache_key
        if: env.RELEASE_ENV == 'dev'
        env:
          NODE_BUILD_BASE: ${{ steps.media.outputs.media_node_base }}
        run: echo "base=$(printf '%s' "$NODE_BUILD_BASE" | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Free unused runner toolchains and record disk space
        if: env.RELEASE_ENV == 'dev'
        shell: bash
        run: |
          echo '::group::df before cleanup'; df -h / /home/runner 2>/dev/null || true; echo '::endgroup::'
          # ENOSPC killed a dev build (41825625879); these preinstalled toolchains are unused here.
          # Deleting them took 30-198 s in the foreground, so it runs detached while the cache restore and build start;
          # the build needs the space minutes later and the step after the build records whether it finished.
          sudo -b sh -c 'rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; touch /tmp/runner-cleanup-done' || echo '::warning::Runner cleanup skipped'
      - name: Restore trusted DEV Next build cache
        continue-on-error: true
        if: env.RELEASE_ENV == 'dev'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci/next-build-cache
          key: dev-next-v2-${{ runner.os }}-${{ steps.next_cache_key.outputs.base }}-${{ hashFiles('package-lock.json', 'apps/web/next.config.ts', 'Dockerfile.aws') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dev-next-v2-${{ runner.os }}-${{ steps.next_cache_key.outputs.base }}-${{ hashFiles('package-lock.json', 'apps/web/next.config.ts', 'Dockerfile.aws') }}-
      - name: Set up DEV BuildKit
        if: env.RELEASE_ENV == 'dev'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # The hosted runner is discarded after the job; removing the builder took 26-54 s and delayed the DEV notice.
          cleanup: false
      - name: Record disk space before the dev build
        if: env.RELEASE_ENV == 'dev'
        shell: bash
        run: |
          df -h / /home/runner 2>/dev/null || true
          du -sh .ci/next-build-cache node_modules 2>/dev/null || true
          docker system df 2>/dev/null || true
      - name: Build one secretless dev image
        id: build
        if: env.RELEASE_ENV == 'dev'
        env:
          MEDIA_REUSE: ${{ steps.media.outputs.media_reuse }}
          REUSED_MEDIA_DIGEST: ${{ steps.media.outputs.media_digest }}
          NODE_BUILD_BASE: ${{ steps.media.outputs.media_node_base }}
          MEDIA_LAMBDA_BASE: ${{ steps.media.outputs.media_lambda_base }}
        shell: bash
        run: |
          set -euo pipefail
          repository=$(jq -r '.parameters.WebImageUri | split("@")[0]' <<<"$AWS_PLATFORM_CONFIG_JSON")
          registry=${repository%%/*}
          aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin "$registry"
          tag="$repository:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p .ci/next-build-cache
          # No remote BuildKit cache: exporting it cost 8.8-17.2 min per run and the cached npm layer saved nothing (SPEED-CI).
          docker buildx build --load --platform linux/amd64 --build-arg NODE_BUILD_BASE="$NODE_BUILD_BASE" \
            --build-context nextcache=.ci/next-build-cache -f Dockerfile.aws -t "$tag" .
          docker run --rm --entrypoint node "$tag" -e "if(require('fs').existsSync('/app/.env'))process.exit(1);if(process.version.split('.')[0]!=='v24')process.exit(1)"
          docker push "$tag"
          name=${repository#*/}
          digest=$(aws ecr describe-images --region ap-northeast-2 --repository-name "$name" --image-ids imageTag="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --query 'imageDetails[0].imageDigest' --output text)
          media_tag="$repository:media-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ "$MEDIA_REUSE" = true ]; then
            media_digest="$REUSED_MEDIA_DIGEST"
          else
            docker build --platform linux/amd64 --build-arg NODE_BUILD_BASE="$NODE_BUILD_BASE" --build-arg MEDIA_LAMBDA_BASE="$MEDIA_LAMBDA_BASE" -f Dockerfile.media.aws -t "$media_tag" .
            docker run --rm --entrypoint node "$media_tag" -e "require('sharp');const c=require('node:child_process');c.execFileSync(require('ffmpeg-static'),['-version']);c.execFileSync(require('ffprobe-static').path,['-version']);require('./index.cjs')"
            docker push "$media_tag"
            media_digest=$(aws ecr describe-images --region ap-northeast-2 --repository-name "$name" --image-ids imageTag="media-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --query 'imageDetails[0].imageDigest' --output text)
          fi
          node scripts/aws-release-bundle.mjs
          cron_digest=$(sha256sum work/aws-release/aws-cron.zip | cut -d ' ' -f1)
          node scripts/aws-release.mjs build-record dev "$digest" "$repository@$digest" "$media_digest" "$repository@$media_digest" "$cron_digest"
          node scripts/aws-release-media-reuse.mjs finish "$GITHUB_SHA" "$media_digest"
          # Export only the compiler cache and the typecheck build info, never Next's fetched data cache or runtime output.
          # The export replaces the restored directory: merging kept stale files and grew the cache from 2.58 to 2.94 GB in four runs.
          rm -rf .ci/next-build-cache-export
          mkdir -p .ci/next-build-cache-export
          if docker buildx build --target next-cache-export --platform linux/amd64 --build-arg NODE_BUILD_BASE="$NODE_BUILD_BASE" \
            --build-context nextcache=.ci/next-build-cache --output type=local,dest=.ci/next-build-cache-export -f Dockerfile.aws . &&
            rm -rf .ci/next-build-cache && mv .ci/next-build-cache-export .ci/next-build-cache; then
            echo 'next_cache_ready=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Optional Next compiler cache export failed; release image validation is unchanged.'
          fi
      - name: Save trusted DEV Next build cache
        if: env.RELEASE_ENV == 'dev' && steps.build.outputs.next_cache_ready == 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci/next-build-cache
          key: dev-next-v2-${{ runner.os }}-${{ steps.next_cache_key.outputs.base }}-${{ hashFiles('package-lock.json', 'apps/web/next.config.ts', 'Dockerfile.aws') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record disk space after the dev build
        if: always() && env.RELEASE_ENV == 'dev'
        continue-on-error: true
        shell: bash
        run: |
          df -h / /home/runner 2>/dev/null || true
          docker system df 2>/dev/null || true
          test -e /tmp/runner-cleanup-done && echo 'Runner cleanup finished.' || echo '::warning::Runner cleanup had not finished by the end of the build.'
      - name: Bind artifact, main ancestry and environment config
        id: prepare
        run: node scripts/aws-release.mjs prepare "$RELEASE_ENV"
      - name: Print the Docker Buildx version used for promotion
        if: env.RELEASE_ENV != 'dev'
        run: docker buildx version || echo '::warning::Could not print the Docker Buildx version; promotion continues.'
      - name: Promote the same image into the target account
        if: env.RELEASE_ENV != 'dev'
        env:
          SOURCE_IMAGE: ${{ steps.prepare.outputs.source_image }}
          TARGET_IMAGE: ${{ steps.prepare.outputs.target_image }}
          RELEASE_DIGEST: ${{ steps.prepare.outputs.digest }}
          RELEASE_SHA: ${{ steps.prepare.outputs.sha }}
          SOURCE_MEDIA_IMAGE: ${{ steps.prepare.outputs.source_media_image }}
          TARGET_MEDIA_IMAGE: ${{ steps.prepare.outputs.target_media_image }}
          MEDIA_DIGEST: ${{ steps.prepare.outputs.media_digest }}
        run: node scripts/aws-release-images.mjs
      - name: Require successful checks for the exact release commit
        run: node scripts/aws-release-ci.mjs "$(jq -r .sourceSha work/aws-release/aws-release.json)" "${SOURCE_RUN_ID:-$GITHUB_RUN_ID}"
      - name: Validate and deploy CloudFormation
        run: node scripts/aws-platform-deploy.mjs deploy --config work/aws-release/aws-release-config.json --execute
      - name: Require healthy ECS and exact release readiness
        id: verify
        run: node scripts/aws-release.mjs verify "$RELEASE_ENV"
      - name: Deploy ownership-verified disabled-by-default schedules
        if: env.AWS_SCHEDULE_CONFIG_JSON != ''
        run: node scripts/aws-release-cron.mjs deploy
      - name: Record the verified GitHub deployment
        run: node scripts/aws-release.mjs record "$RELEASE_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: aws-release-source
          path: |
            work/aws-release/aws-release.json
            work/aws-release/aws-cron.zip
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: aws-result-${{ env.RELEASE_ENV }}
          path: |
            work/aws-release/aws-${{ env.RELEASE_ENV }}-result.json
            work/aws-release/aws-deployment-event.json
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: env.RELEASE_ENV == 'dev'
        with:
          name: aws-media-proof
          overwrite: true
          path: work/aws-release/aws-media-proof.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aws-release-diagnostics-${{ env.RELEASE_ENV }}
          overwrite: true
          path: |
            work/aws-release/ci-proof.json
            work/aws-release/image-promotion.json
            work/aws-release/aws-media-prepared.json
            work/aws-schedules/result.json

  # Keep notice failures visible without changing the verified service result.
  notice:
    name: Production deployment notice
    needs: release
    if: needs.release.result == 'success' && inputs.environment == 'prod' && needs.release.outputs.public_live == 'true'
    continue-on-error: true
    # Pinned to match the release job's runner image instead of the moving ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: prod
    permissions:
      contents: read
      actions: read
      deployments: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: aws-result-prod
          path: work/aws-release
      # GITHUB_TOKEN deployment statuses do not trigger another workflow.
      - name: Notify only a release live on the public production domain
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_NOTICE_EVENT_PATH: ${{ github.workspace }}/work/aws-release/aws-deployment-event.json
          TELEGRAM_BUG_REPORT_OPERATOR_SECRET: ${{ secrets.TELEGRAM_BUG_REPORT_OPERATOR_SECRET }}
        run: node scripts/deployment-notices.mjs send
      - name: Record a separate notice failure
        if: failure()
        run: |
          echo '::error::Production deployment succeeded; its automatic notice failed. Inspect the notice receipt before any retry.'
          echo '### Notice failed after successful production deployment' >> "$GITHUB_STEP_SUMMARY"
          echo 'The verified service result is unchanged. No automatic resend or receipt reset was performed.' >> "$GITHUB_STEP_SUMMARY"

  dev-notice:
    name: DEV deployment notice
    needs: release
    # The DEV notice endpoint only trusts main; do not widen server policy for a hotfix.
    if: github.ref == 'refs/heads/main' && needs.release.result == 'success' && (inputs.environment == 'dev' || github.event_name == 'push')
    continue-on-error: true
    # Pinned to match the release job's runner image instead of the moving ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: dev
    permissions:
      contents: read
      actions: read
      deployments: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: aws-result-dev
          path: work/aws-release
      - name: Notify the exact successful DEV release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_NOTICE_EVENT_PATH: ${{ github.workspace }}/work/aws-release/aws-deployment-event.json
          TELEGRAM_BUG_REPORT_OPERATOR_SECRET: ${{ secrets.TELEGRAM_BUG_REPORT_OPERATOR_SECRET }}
        run: node scripts/dev-deployment-notices.mjs
      - name: Preserve an uncertain DEV notice for inspection
        if: failure()
        run: |
          echo '::error::DEV deployment succeeded; its notice failed. Inspect the DEV receipt and room before retrying.'
