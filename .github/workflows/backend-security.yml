name: Backend security boundaries
on:
  pull_request:
    paths:
      - 'apps/web/server/**'
      - 'apps/web/app/api/**'
      - 'apps/web/features/auth/**'
      - 'apps/web/features/wave-stage/**'
      - 'apps/web/e2e/wave-stage-local/**'
      - 'apps/stage-console/**'
      - 'apps/worker/**'
      - 'supabase/**'
      - 'contracts/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/backend-security.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/server/**'
      - 'apps/web/app/api/**'
      - 'apps/web/features/auth/**'
      - 'apps/web/features/wave-stage/**'
      - 'apps/web/e2e/wave-stage-local/**'
      - 'apps/stage-console/**'
      - 'apps/worker/**'
      - 'supabase/**'
      - 'contracts/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/backend-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run typecheck --workspace @byus/worker
      - name: API authorization, disclosure and outbound URL regression tests
        run: >-
          npm run test --workspace @byus/web -- --maxWorkers=3
          features/auth server/auth server/fan-auth
          server/telegram/deployment-notice.test.ts
          server/youtube app/api/public/live-now/route.test.ts
          server/avatar features/profile/domain/public-avatar.test.ts
          features/community-stamps server/community-stamps
          server/notice/notice-admin-security.test.ts server/notification
          server/fan-posts server/content-translation server/schedules
          server/certification/certification-image.test.ts
          server/profile/account-deletion.test.ts server/my/fan-history-route.test.ts
          server/byus-day/participation-crypto.test.ts server/byus-day/participation-route.test.ts
          server/onchain app/api/public/onchain app/api/internal/onchain-dashboard
          server/g4/passport-read-repository.test.ts server/reaction/reaction-repository.test.ts
          server/fanpage/program-routes.test.ts server/fanpage/cheer-event-routes.test.ts server/fanpage/public-cheer-event.test.ts server/fanpage/community-routes.test.ts
          server/g5/benefit-draw-route.test.ts server/g5/benefit-draw-repository.test.ts
          server/wave/quiz-stamp.test.ts server/wave/bingo-stamp.test.ts server/wave-stage features/wave-stage server/tiktok server/photocards server/public-live-dashboard.test.ts
          server/g4/benefit-repository.test.ts components/admin/cheer-event-participants.test.tsx
          components/admin/benefit-manager.test.tsx
          server/runmusic features/runmusic features/connect/runmusic
      - name: Install locked stage host runtime dependencies without Electron
        run: npm ci --prefix apps/stage-console --omit=dev --ignore-scripts
      - name: Verify stage host roles, recovery and presentation state
        run: node --test apps/stage-console/test/*.test.mjs
      - name: Verify controller and authenticated source over real local WebSockets
        working-directory: apps/web
        run: npx vitest run --config e2e/wave-stage-local/operator-integration.vitest.config.ts e2e/wave-stage-local/operator-bridge.integration.spec.tsx
      - run: npm run test --workspace @byus/worker
      - run: npm run build --workspace @byus/worker
      - run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Replay migrations and exercise real role and concurrent quota boundaries
        run: npm run security:backend-db
      - name: Verify YouTube live Telegram deduplication and concurrent capture
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          bash scripts/verify-telegram-youtube-live-starts.sh
      - name: Verify creator raffle eligibility and ownership concurrency
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          BYUS_CLEAN_DB_PORT=55486 \
          BYUS_CLEAN_DB_ASSERTION_FILE=supabase/tests/cheer_event_campaigns.sql \
          BYUS_CLEAN_DB_SHELL_ASSERTION_FILE=supabase/tests/cheer_event_campaigns_concurrency.sh \
          bash scripts/verify-clean-migration-chain.sh
      - name: Verify KYAA WAVE participation privacy and owner concurrency
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          BYUS_CLEAN_DB_PORT=55487 \
          BYUS_CLEAN_DB_ASSERTION_FILE=supabase/tests/kyaa_wave_participation.sql \
          BYUS_CLEAN_DB_SHELL_ASSERTION_FILE=supabase/tests/kyaa_wave_participation_concurrency.sh \
          bash scripts/verify-clean-migration-chain.sh
      - name: Verify fan event prize upgrade, atomic draw and private photocards
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          BYUS_CLEAN_DB_PORT=55494 \
          BYUS_CLEAN_DB_UPGRADE_MIGRATION=20261129024000_wave_stage_rewards.sql \
          BYUS_CLEAN_DB_UPGRADE_BEFORE_FILE=supabase/tests/wave_stage_upgrade_before.sql \
          BYUS_CLEAN_DB_UPGRADE_AFTER_FILE=supabase/tests/wave_stage_upgrade_after.sql \
          BYUS_CLEAN_DB_ASSERTION_FILE=supabase/tests/wave_stage.sql \
          BYUS_CLEAN_DB_SHELL_ASSERTION_FILE=supabase/tests/wave_stage_concurrency.sh \
          bash scripts/verify-clean-migration-chain.sh
      - name: Verify presentation aggregates and verified chain snapshot isolation
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          printf '\\i %s\n' "$PWD/supabase/tests/wave_stage_presentation.sql" "$PWD/supabase/tests/wave_stage_participation_counts.sql" "$PWD/supabase/tests/participation_ledger_queue.sql" "$PWD/supabase/tests/participation_finalized_reverts.sql" "$PWD/supabase/tests/onchain_dashboard_snapshot.sql" > /tmp/wave-presentation-assertions.sql
          BYUS_CLEAN_DB_PORT=55493 \
          BYUS_CLEAN_DB_ASSERTION_FILE=/tmp/wave-presentation-assertions.sql \
          BYUS_CLEAN_DB_SHELL_ASSERTION_FILE=supabase/tests/participation_nonce_concurrency.sh \
          bash scripts/verify-clean-migration-chain.sh
      - name: Verify LIVE participation upgrade, privacy and concurrent rewards
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          bash scripts/verify-live-participation.sh
      - name: Verify RUN&MUSIC participation and draw concurrency
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          BYUS_CLEAN_DB_PORT=55488 \
          BYUS_CLEAN_DB_UPGRADE_MIGRATION=20261129040000_runmusic_simple_entry.sql \
          BYUS_CLEAN_DB_UPGRADE_BEFORE_FILE=supabase/tests/fixtures/runmusic_simple_entry_before.sql \
          BYUS_CLEAN_DB_UPGRADE_AFTER_FILE=supabase/tests/fixtures/runmusic_simple_entry_after.sql \
          BYUS_CLEAN_DB_ASSERTION_FILE=supabase/tests/runmusic_participation.sql \
          BYUS_CLEAN_DB_SHELL_ASSERTION_FILE=supabase/tests/runmusic_participation_concurrency.sh \
          bash scripts/verify-clean-migration-chain.sh
      - name: Verify Wave program participation and stamp concurrency
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          bash scripts/verify-kyaa-wave-programs.sh
      - name: Verify Wave quiz stamps and home cheer missions
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          BYUS_CLEAN_DB_PORT=55492 \
          BYUS_CLEAN_DB_ASSERTION_FILE=supabase/tests/kyaa_wave_quiz_cheer.sql \
          BYUS_CLEAN_DB_SHELL_ASSERTION_FILE=supabase/tests/kyaa_wave_quiz_cheer_concurrency.sh \
          bash scripts/verify-clean-migration-chain.sh
      - name: Verify Wave mission onchain stamps and manual grant concurrency
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          BYUS_CLEAN_DB_PORT=55493 \
          BYUS_CLEAN_DB_ASSERTION_FILE=supabase/tests/kyaa_wave_mission_stamps.sql \
          BYUS_CLEAN_DB_SHELL_ASSERTION_FILE=supabase/tests/kyaa_wave_mission_stamps_concurrency.sh \
          bash scripts/verify-clean-migration-chain.sh
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge test --root contracts
      - name: Verify immediate-registration deployment plan guards
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          RUN_DIRECT_LEGACY_DB_TEST=1 node --test scripts/prepare-action-hub-cutover.test.mjs scripts/register-giwa-campaign.test.mjs scripts/migrate-kyaa-giwa.test.mjs scripts/pin-metadata-assets.test.mjs scripts/migrate-existing-nfts-giwa.test.mjs scripts/replace-existing-nfts-giwa.test.mjs scripts/direct-legacy-nfts-giwa.test.mjs
      - name: Exercise worker to ActionHub on local Anvil
        run: RUN_ACTION_ANVIL_INTEGRATION=1 npm run test --workspace @byus/worker -- test/action-anvil.integration.test.ts
      - name: Validate ActionHub namespace upgrade compatibility
        working-directory: contracts
        run: bash scripts/verify-storage.sh
