name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - run: npm run security:patch

      - name: Enforce audit baseline
        run: npm run security:audit:baseline

      - name: Reject high and critical advisories in development tools
        run: npm audit --audit-level=high --ignore-scripts

      - name: Verify patched dependency constraints
        run: npm run security:verify

      - name: Check editor and wallet patch regressions
        run: node --test scripts/security-patch-regression.test.mjs

      - name: Check conservative web build skipping
        run: node --test scripts/vercel-ignore-build.test.mjs

      - name: Check public telemetry privacy boundary
        run: npm run test --workspace @byus/web -- features/analytics/client/vercel-telemetry.test.tsx
