name: Dependency audit

on:
  pull_request:
  push:
    branches: [main, release/production]
  schedule:
    - cron: "17 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-dependencies:
    concurrency:
      group: ${{ github.workflow }}-production-dependencies-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - run: npm run security:patch

      - name: Enforce audit baseline
        run: npm run security:audit:baseline

      - name: Reject high and critical advisories in development tools
        run: npm audit --audit-level=high --ignore-scripts

      - name: Verify patched dependency constraints
        run: npm run security:verify

      - name: Check editor and wallet patch regressions
        run: node --test scripts/security-patch-regression.test.mjs

      - name: Check conservative web build skipping
        run: node --test scripts/vercel-ignore-build.test.mjs

      - name: Check public telemetry privacy boundary
        run: npm run test --workspace @byus/web -- features/analytics/client/public-telemetry-path.test.ts
